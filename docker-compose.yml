name: vault-sync

services:
  couchdb:
    image: couchdb:3.4
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCH_USER:?set COUCH_USER in .env}
      COUCHDB_PASSWORD: ${COUCH_PASSWORD:?set COUCH_PASSWORD in .env}
    volumes:
      - couch_data:/opt/couchdb/data
      # Not :ro, because CouchDB's entrypoint chmods this file on start.
      - ./couchdb/local.ini:/opt/couchdb/etc/local.ini
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf -u "$$COUCHDB_USER:$$COUCHDB_PASSWORD" http://localhost:5984/_session | grep -q ok
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks: [internal, edge]
    # No published port: outside access goes through the reverse proxy.
    # To test locally, uncomment:
    # ports: ["127.0.0.1:5984:5984"]

  # Sets up auth, CORS, limits, the database and the sync user. Runs once and exits.
  couchdb-init:
    image: curlimages/curl:8.10.1
    restart: on-failure
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCH_INTERNAL_URL: http://couchdb:5984
      COUCH_USER: ${COUCH_USER}
      COUCH_PASSWORD: ${COUCH_PASSWORD}
      COUCH_SYNC_USER: ${COUCH_SYNC_USER:?set COUCH_SYNC_USER in .env}
      COUCH_SYNC_PASSWORD: ${COUCH_SYNC_PASSWORD:?set COUCH_SYNC_PASSWORD in .env}
      COUCH_DB: ${COUCH_DB:-obsidian}
    volumes:
      - ./couchdb/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    networks: [internal]

  # Keeps the vault database restricted to the sync user. A device's "Rebuild
  # everything" in LiveSync deletes and recreates the database, and CouchDB
  # recreates it admin-only; this puts the permissions back automatically.
  couchdb-guard:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      couchdb-init:
        condition: service_completed_successfully
    environment:
      COUCH_INTERNAL_URL: http://couchdb:5984
      COUCH_USER: ${COUCH_USER}
      COUCH_PASSWORD: ${COUCH_PASSWORD}
      COUCH_SYNC_USER: ${COUCH_SYNC_USER}
      COUCH_SYNC_PASSWORD: ${COUCH_SYNC_PASSWORD}
      COUCH_DB: ${COUCH_DB:-obsidian}
      COUCH_GUARD_INTERVAL: ${COUCH_GUARD_INTERVAL:-30}
    volumes:
      - ./couchdb/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh", "--watch"]
    networks: [internal]

  vault-core:
    build: ./vault-core
    # Deploys point this at the release image (built elsewhere) and start with
    # --no-build; locally, `--build` produces this tag.
    image: ${VAULT_CORE_IMAGE:-vault-sync/vault-core:dev}
    restart: unless-stopped
    depends_on:
      couchdb-init:
        condition: service_completed_successfully
    environment:
      COUCH_URL: http://couchdb:5984
      COUCH_DB: ${COUCH_DB:-obsidian}
      # The non-admin sync user: it can read the vault, and write to it for
      # the MCP write tools (MCP_WRITE), but never touch server settings.
      COUCH_USER: ${COUCH_SYNC_USER}
      COUCH_PASSWORD: ${COUCH_SYNC_PASSWORD}
      VAULT_DIR: /data/vault
      STATE_PATH: /data/state/vault-core.db
      HTTP_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-vault_core=info}
      BACKUP_INTERVAL_SECS: ${BACKUP_INTERVAL_SECS:-600}
      BACKUP_GIT_DIR: /data/state/vault.git
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_BRANCH: ${BACKUP_BRANCH:-main}
      # Only used if the file exists (see the README).
      BACKUP_SSH_KEY: /run/secrets/backup_deploy_key
      # MCP server: only starts with MCP_TOKEN and/or MCP_PASSWORD set.
      MCP_ADDR: 0.0.0.0:8081
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://${VAULT_DOMAIN:-}}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_PASSWORD: ${MCP_PASSWORD:-}
      MCP_WRITE: ${MCP_WRITE:-false}
      MCP_SKILLS_DIR: ${MCP_SKILLS_DIR:-skills}
      MCP_WRITE_SKILLS: ${MCP_WRITE_SKILLS:-}
    volumes:
      - vault_mirror:/data/vault
      - vault_state:/data/state
      - ${SECRETS_DIR:-./secrets}:/run/secrets:ro
    healthcheck:
      test: ["CMD", "vault-core", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # `edge` lets the proxy reach port 8081 (MCP). Port 8080 (the search API)
    # has no authentication and the proxy must never point at it.
    networks: [internal, edge]

  # Reverse proxy with automatic HTTPS. Only starts with `--profile proxy`.
  # If something already owns ports 80/443 on the host, skip this and use
  # docker-compose.traefik.yml or your own proxy (see the README).
  caddy:
    image: caddy:2
    profiles: [proxy]
    restart: unless-stopped
    depends_on: [couchdb]
    environment:
      VAULT_DOMAIN: ${VAULT_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

networks:
  internal:
  edge:

volumes:
  couch_data:
  vault_mirror:
  vault_state:
  caddy_data:
  caddy_config:
