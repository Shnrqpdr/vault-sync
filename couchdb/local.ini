; CouchDB configuration for Self-hosted LiveSync.
; Based on docker/config/livesync.ini from vrtmrz/obsidian-livesync (MIT).
;
; Do NOT set require_valid_user here: CouchDB must boot without auth to create
; _users and _replicator on first start. The couchdb-init service turns
; authentication on through the REST API right after.

[couchdb]
max_document_size = 50000000

[chttpd]
bind_address = 0.0.0.0
port = 5984
max_http_request_size = 4294967296

[httpd]
WWW-Authenticate = Basic realm="couchdb"

[cors]
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost

[log]
level = warning
