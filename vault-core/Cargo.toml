[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
description = "Mirrors an Obsidian vault from a Self-hosted LiveSync CouchDB, with Git backups, search and an MCP server"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
percent-encoding = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tantivy = "0.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal", "time", "sync", "net", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
